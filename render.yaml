# Blueprint do Render: API Flask + PostgreSQL gerenciado.
# No painel do Render: New > Blueprint > selecione este repositório.
databases:
  - name: cupcake-db
    plan: free
    databaseName: cupcake
    user: cupcake

services:
  - type: web
    name: cupcake-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app run seed && gunicorn run:app --bind 0.0.0.0:$PORT
    healthCheckPath: /api/saude
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: cupcake-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_SENHA
        sync: false          # defina no painel: senha do usuário administrador
      - key: CORS_ORIGINS
        sync: false          # defina no painel: URL do front na Vercel
